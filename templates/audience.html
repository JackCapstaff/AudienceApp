<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Audience View</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      height: 100%;
      width: 100%;
    }
    img, video {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: contain;
      opacity: 0; visibility: hidden;
      transition: opacity 1s ease;
    }
    /* Main display layers */
    #slide-img, #media-player { z-index: 3; }
    /* Crossfade overlay layers (sit above main) */
    #crossfade-img, #crossfade-video { z-index: 4; }

    /* Black overlay for fade-to/from-black */
    #black-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: black;
      opacity: 0; visibility: hidden;
      z-index: 5;
      transition: opacity 1s ease;
    }
    .blackened { opacity: 1 !important; visibility: visible !important; }
    .show { opacity: 1 !important; visibility: visible !important; }
  </style>
</head>
<body>
  <!-- Primary layers -->
  <img id="slide-img" alt="">
  <video id="media-player" playsinline muted></video>

  <!-- Crossfade overlay layers -->
  <img id="crossfade-img" alt="">
  <video id="crossfade-video" playsinline muted></video>

  <!-- Fade-to-black overlay -->
  <div id="black-overlay"></div>

  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script>
    const socket = io({ transports: ['websocket'] });

    const slideImg = document.getElementById('slide-img');
    const mediaPlayer = document.getElementById('media-player');
    const crossfadeImg = document.getElementById('crossfade-img');
    const crossfadeVideo = document.getElementById('crossfade-video');
    const blackOverlay = document.getElementById('black-overlay');

    let lastAsset = { type: 'slide', name: 'holdingslide.jpg' };

    // ---- Audio fade (Web Audio API) ----
    let audioCtx;
    function fadeAudio(videoEl, fromGain, toGain, duration = 1.0) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaElementSource(videoEl);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(fromGain, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(toGain, audioCtx.currentTime + duration);
        src.connect(gain).connect(audioCtx.destination);
        setTimeout(() => { try { src.disconnect(); gain.disconnect(); } catch(e){} }, duration * 1000 + 200);
      } catch (e) {
        console.warn('Audio fade unavailable:', e);
      }
    }

    // ---- Black overlay helpers ----
    function fadeBlackOverlay(show, duration = 1) {
      blackOverlay.style.transition = `opacity ${duration}s ease`;
      if (show) blackOverlay.classList.add('blackened');
      else blackOverlay.classList.remove('blackened');

      blackOverlay.style.visibility = 'visible';
      setTimeout(() => { if (!show) blackOverlay.style.visibility = 'hidden'; }, duration * 1000);
    }

    // ---- Non-crossfade render (initial or direct display) ----
    function updateView(asset) {
      lastAsset = asset;
      slideImg.classList.remove('show');
      mediaPlayer.classList.remove('show');

      if (asset.type === 'slide') {
        slideImg.src = `/static/slides/${asset.name}`;
        slideImg.classList.add('show');
      } else if (asset.type === 'video') {
        mediaPlayer.src = `/static/media/${asset.name}`;
        mediaPlayer.classList.add('show');
        mediaPlayer.load();
        if (asset.autoplay !== false) { mediaPlayer.play().catch(()=>{}); }
      }
    }

    // ---- Crossfade render (supports video↔video overlap with audio fade) ----
    function crossfadeTo(asset) {
      const duration = Number(asset.crossfade_duration ?? 1.5);

      // Fade-from-black flow
      if (asset.fromBlack) {
        updateView(asset);
        fadeBlackOverlay(false, duration);
        lastAsset = asset;
        return;
      }

      const prevType = lastAsset.type;
      const newType = asset.type;
      const main = (prevType === 'video') ? mediaPlayer : slideImg;
      const overlay = (newType === 'video') ? crossfadeVideo : crossfadeImg;

      // Prepare overlay with the incoming asset
      if (newType === 'video') {
        overlay.src = `/static/media/${asset.name}`;
        overlay.load();
        overlay.currentTime = 0;
        overlay.play().catch(()=>{});
        fadeAudio(overlay, 0.0, 1.0, duration);
      } else {
        overlay.src = `/static/slides/${asset.name}`;
      }

      // Make both layers visible for the crossfade
      overlay.style.transition = `opacity ${duration}s ease`;
      main.style.transition    = `opacity ${duration}s ease`;
      overlay.style.opacity = 0;         overlay.style.visibility = 'visible';
      main.style.opacity = 1;            main.style.visibility    = 'visible';

      // If outgoing was video, fade its audio out
      if (prevType === 'video') fadeAudio(mediaPlayer, 1.0, 0.0, duration);

      // Start the visual crossfade
      requestAnimationFrame(() => {
        overlay.style.opacity = 1; // in
        main.style.opacity = 0;    // out
      });

      // After fade completes → swap roles
      setTimeout(() => {
        // Hide/stop old main
        if (prevType === 'video') {
          mediaPlayer.pause();
          mediaPlayer.removeAttribute('src');
        }
        main.style.visibility = 'hidden';
        main.style.opacity = 0;

        // Move overlay to main
        if (newType === 'video') {
          mediaPlayer.src = overlay.src;
          mediaPlayer.load();
          // Keep roughly the same timeline as overlay
          try { mediaPlayer.currentTime = overlay.currentTime; } catch(e){}
          mediaPlayer.play().catch(()=>{});
        } else {
          slideImg.src = overlay.src;
        }

        // Reset overlay
        overlay.pause && overlay.pause();
        overlay.style.opacity = 0;
        overlay.style.visibility = 'hidden';
        overlay.removeAttribute('src');

        // Reveal the new main
        const newMain = (newType === 'video') ? mediaPlayer : slideImg;
        newMain.style.opacity = 1;
        newMain.style.visibility = 'visible';

        lastAsset = asset;
      }, duration * 1000);
    }

    // ---- Socket bindings ----
    socket.on('connect', () => console.log('Audience connected'));
    socket.on('sync_state', updateView);
    socket.on('display_asset', updateView);
    socket.on('crossfade_to', crossfadeTo);
    socket.on('fade_to_black', (d) => fadeBlackOverlay(true, Number(d?.duration ?? 1)));
    socket.on('fade_from_black', (d) => fadeBlackOverlay(false, Number(d?.duration ?? 1)));
  </script>
</body>
</html>
